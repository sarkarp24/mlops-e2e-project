name: CI-CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  # =============================
  # JOB 1: Build & Push Images
  # =============================
  build:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Installs QEMU to translate ARM commands on Intel hardware
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Initializes advanced BuildKit capabilities needed for cross-compiling
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Automatically builds and pushes the ARM64 API image
      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/prodyot-mlops830api:latest
          no-cache: true

      # Automatically builds and pushes the ARM64 UI image
      - name: Build and Push UI Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ui
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/prodyot-mlops830ui:latest
          no-cache: true

  # =============================
  # JOB 2: Deploy to Kubernetes
  # =============================
  deploy:  
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup kubectl
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.USER_KUBE_CONFIG_DATA }}" > ~/.kube/config


    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/api-deployment.yaml
        kubectl apply -f k8s/ui-deployment.yaml
