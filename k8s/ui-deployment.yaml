apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodyot-ui-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: prodyotsarkar/prodyot-mlops830ui:latest
        imagePullPolicy: Always
        env:
        - name: API_HOST
          value: "prodyot-api-svc"
        ports:
        - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: prodyot-ui-svc
spec:
  type: NodePort
  selector:
    app: ui
  ports:
  - port: 8501
    targetPort: 8501
    nodePort: 30001
